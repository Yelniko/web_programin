<main id="main" class="main">
    <h2 class="main__title">
        Зв'яжіться з нами
    </h2>

    <form
            class="contact-form"
            action="#"
            method="post"
    >
        <h3 class="contact-form__title">
            Форма зворотного зв'язку
        </h3>

        <div class="contact-form__item">
            <label
                    class="contact-form__label"
                    for="name"
            >
                Ім'я
            </label>

            <input
                    class="contact-form__input"
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Ваше ім'я"
                    minlength="2"
                    maxlength="50"
                    pattern="[А-Яа-яІіЇїЄєҐґA-Za-zÀ-ÿ\s'’-]+"
                    title="Введіть від 2 до 50 символів: українські або латинські літери, пробіл, тире чи апостроф."
                    autocomplete="name"
                    required
            >
        </div>

        <div class="contact-form__item">
            <label
                    class="contact-form__label"
                    for="email"
            >
                Email
            </label>

            <input
                    class="contact-form__input"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Ваш email"
                    autocomplete="email"
                    required
            >
        </div>

        <div class="contact-form__item">
            <label
                    class="contact-form__label"
                    for="phone"
            >
                Телефон
            </label>

            <input
                    class="contact-form__input"
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="+380 (50) 123-45-67"
                    pattern="\+380\s?\((50|63|66|67|68|73|91|92|93|94|95|96|97|98|99)\)\s?\d{3}[-\s]?\d{2}[-\s]?\d{2}"
                    title="Введіть український номер у форматі +380 (50) 123-45-67."
                    autocomplete="tel"
                    required
            >
        </div>

        <div class="contact-form__item">
            <label
                    class="contact-form__label"
                    for="message"
            >
                Повідомлення
            </label>

            <textarea
                    class="contact-form__textarea"
                    id="message"
                    name="message"
                    rows="6"
                    minlength="10"
                    maxlength="500"
                    placeholder="Ваше повідомлення"
                    required
            ></textarea>
        </div>

        <button
                class="contact-form__button"
                type="submit"
        >
            Надіслати
        </button>
    </form>
</main>
